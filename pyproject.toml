[project]
name = "mumax2csv"
version = "0.1"
authors = [
    { name = "Samarthya Lykamanuella", email = "lykamanuella@outlook.com" },
]
maintainers = [
    { name = "Samarthya Lykamanuella", email = "lykamanuella@outlook.com" },
]
dependencies = [
]
license = "MIT"
keywords = ["conversion", "CSV", "data table", "GNU Plot", "magnetism", "micromagnetic", "micromagnetics", "Mumax", "Mumax3", "nanomagnetic", "physics", "simulation"]
description = "Converts a micromagnetic data table file generated by Mumax3 simulations into a CSV data file for better compatibility with modern applications"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Education :: Testing",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/samarlyka/mumax2csv"
Repository = "https://github.com/samarlyka/mumax2csv.git"
Issues = "https://github.com/samarlyka/mumax2csv/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mumax2csv"]
